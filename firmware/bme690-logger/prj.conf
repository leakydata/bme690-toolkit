# Sensors sit on a shared SPI bus, one chip select each.
CONFIG_SPI=y
CONFIG_GPIO=y

# Compensation is double-precision in Bosch's reference; keep it that way so
# readings match the desktop tooling bit for bit.
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Console over USB CDC-ACM: the XIAO has no spare UART pins once eight chip
# selects are allocated.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="BME690 logger"
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
