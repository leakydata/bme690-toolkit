# Publishes the project site to GitHub Pages:
#   /         the browser installer, serving the ESP32-S3 firmware built here
#   /studio/  BME Studio, the browser app for sensor data
name: Site

on:
  push:
    branches: [main]
    paths:
      - "firmware/bme690-logger-idf/**"
      - "firmware/common/**"
      - "web/install/**"
      - "studio/**"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          path: firmware/bme690-logger-idf
          command: idf.py build && idf.py merge-bin -o merged.bin

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Build BME Studio
        working-directory: studio
        run: |
          npm ci
          npm test
          npm run build

      - name: Assemble site
        run: |
          set -eu
          fw=firmware/bme690-logger-idf
          version=$(sed -n 's/^#define FW_VERSION *"\(.*\)"/\1/p' "$fw/main/board.h")
          mkdir -p site
          cp web/install/index.html site/
          cp -r studio/dist site/studio
          sudo cp "$fw/build/merged.bin" site/bme690-logger-esp32s3.bin
          sudo chown "$(id -u)" site/bme690-logger-esp32s3.bin
          sed "s/\"version\": \"dev\"/\"version\": \"$version (${GITHUB_SHA::7})\"/" \
            web/install/manifest.json > site/manifest.json
          ls -la site
          cat site/manifest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
